<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title description">
<title id="title">Cakupan wilayah untuk jaringan Low, Medium, dan High</title>
<desc id="description">Low mencakup wilayah 01. Medium mencakup 01 sampai 04. High mencakup 01 sampai 12. Wilayah 01 selalu memakai rute lokal Low, 02 sampai 04 memakai rute lokal Medium, dan 05 sampai 12 memakai rute lokal High. Contoh terpisah menunjukkan masing-masing pengiriman lokal dari P1 melalui G2 ke K1 di wilayah 01 dan 02.</desc>
